# Producción en un Droplet: app (Node + SQLite en el volumen app-data) detrás de Caddy (HTTPS).
# Uso: cp .env.example .env && nano .env && docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      PUBLIC_URL: https://${DOMAIN:?Define DOMAIN en .env}
      SEED_ON_EMPTY: simposio
    volumes:
      - app-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
